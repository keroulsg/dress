# ==============================================================================
# Maison Rentale — Supervisor Queue Worker Configuration
# Processes Async Background Jobs: Emails, Webhooks, Settlements & Expired Holds
# ==============================================================================

[program:maisonrentale-worker]
process_name=%(program_name)s_%(process_num)02d
command=php /var/www/maisonrentale/artisan queue:work redis --sleep=3 --tries=3 --max-time=3600 --timeout=180 --stop-when-empty=false
autostart=true
autorestart=true
stopasgroup=true
killasgroup=true
user=www-data
numprocs=4
redirect_stderr=true
stdout_logfile=/var/www/maisonrentale/storage/logs/queue-worker.log
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=5
stopwaitsecs=3600
